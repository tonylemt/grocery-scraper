name: Collect prices
on:
  schedule:
    - cron: "0 11 * * *" # ~6-7am Ottawa
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collector/collect.py --selfcheck
      - run: python3 collector/collect.py
        env:
          POSTAL_CODE: ${{ secrets.POSTAL_CODE }}
      - run: |
          git config user.name "price-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git push
